<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo do Homem-Aranha</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="Paginas/css/Style.css">

    <!-- Font Awesome (para ícones) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body class="index-body">

    <!-- Barra vermelha no topo -->
    <header class="header-bar">
        <div class="container">
            <h1 class="text-center text-white py-3">🕸️ Universo do Homem-Aranha 🕸️</h1>
        </div>
    </header>

    <div class="text-center py-5">
        <p>Escolha seu Aranha favorito e veja curiosidades sobre ele!</p>

        <!-- Container de heróis com as teias no fundo -->
        <div class="hero-grid">
            <!-- Tobey Maguire -->
            <a href="Paginas/tobey maguire.html" class="hero-card">
                <img src="Paginas/images/Toby.jpg" alt="Tobey Maguire" class="hero-img">
                <div class="overlay">
                    <h2>Tobey Maguire</h2>
                </div>
            </a>

            <!-- Andrew Garfield -->
            <a href="Paginas/Andrew Garfield.html" class="hero-card">
                <img src="images/andrew.jpg" alt="Andrew Garfield" class="hero-img">
                <div class="overlay">
                    <h2>Andrew Garfield</h2>
                </div>
            </a>

            <!-- Tom Holland -->
            <a href="Paginas/tom holland.html" class="hero-card">
                <img src="images/tom.jpg" alt="Tom Holland" class="hero-img">
                <div class="overlay">
                    <h2>Tom Holland</h2>
                </div>
            </a>
        </div>
    </div>

    <!-- Barra azul no rodapé -->
    <footer class="footer-bar">
        <div class="container">
            <p class="text-center text-white py-3">© 2025 - Universo do Homem-Aranha | Feito por um verdadeiro fã 🕷️</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
